# Alembic configuration file

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# La URL de conexión se toma de settings.DATABASE_URL (.env o variables de entorno
# del host) según alembic/env.py. Se deja vacío para que siempre use la configuración
# de la aplicación y no queden credenciales hardcodeadas aquí.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S