services:
  # Web Service - FastAPI Backend
  - type: web
    name: fashionstore-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: chmod +x start.sh && ./start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEBUG
        value: "False"
      - key: PORT
        value: "8000"
      - key: DB_HOST
        fromDatabase:
          name: fashionstore-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: fashionstore-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: fashionstore-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: fashionstore-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fashionstore-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: fashionstore-db
          property: connectionString
      - key: SECRET_KEY
        generateString: true
      - key: CORS_ORIGINS
        # Orígenes reales del frontend: producción en Vercel + desarrollo local.
        # Con `allow_credentials=True` NO se puede usar "*": hay que listarlos.
        value: "https://fashionstore-frontend-smoky.vercel.app,http://localhost:4200,http://localhost:3000"
      - key: CORS_ORIGINS_REGEX
        # Las URLs de preview de Vercel cambian de subdominio en cada push
        # (fashionstore-frontend-<hash>.vercel.app). Sin esta regex, un
        # preview nuevo recibe el error "blocked by CORS policy".
        value: "https://fashionstore-frontend(-[a-z0-9-]+)?\\.vercel\\.app"
      - key: WEB_CONCURRENCY
        # El contenedor free de Render tiene 512 MB y 0.1 CPU. Cada worker de
        # gunicorn carga su propia copia del runtime (~200 MB), asi que con 2
        # el contenedor se queda sin memoria, Render lo reinicia y el proxy
        # responde 502 "Bad Gateway".
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # [EXAMEN-2] Keep-alive del free tier (temporal, quitar tras la defensa):
      # URL pública de ESTE servicio backend para el self-ping anti-sleep.
      # Sin esta variable el keep-alive NO corre (main.py lo desactiva si está
      # vacía) y Render suspende el servicio tras ~15 min sin tráfico: la
      # siguiente petición recibe un 502 mientras la instancia despierta.
      - key: RENDER_PUBLIC_URL
        value: "https://fashionstore-backend-3wsr.onrender.com"
      - key: KEEPALIVE_INTERVALO_SEG
        # 10 min < 15 min de inactividad de Render: el servicio no se duerme.
        value: "600"

databases:
  - name: fashionstore-db
    plan: free
    databaseName: tiendaropa
    user: fashionstore
    postgresMajorVersion: "16"
